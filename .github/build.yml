name: openwrt-build-github-actions-720n-v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1️⃣ 拉取代码
      - name: Checkout
        uses: actions/checkout@v3

      # 2️⃣ 安装依赖
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3 \
            rsync unzip zlib1g-dev file wget tree
          mkdir -p bin

      # 3️⃣ 设置 OpenWrt 源
      - name: Clone OpenWrt 22.03.5
        run: |
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout v22.03.5

      # 4️⃣ 运行 build.sh 脚本编译固件
      - name: Build TL-WR720N v3 firmware
        run: |
          chmod +x ./build.sh
          bash ./build.sh v22.03.5 ath79/tiny/tplink_tl-wr720n-v3-16m

      # 5️⃣ 上传生成的固件
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: wr720n-v3-22.03.5
          path: bin/*-squashfs-*.bin
          retention-days: 3
